{
  "name": "Improve a translation",
  "description": "Correct wording or request language coverage.",
  "title": "[Translation] ",
  "labels": [
    "translation"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Suggestions are public and reviewed before publication. Do not include private data."
      }
    },
    {
      "type": "input",
      "id": "locale",
      "attributes": {
        "label": "Language code",
        "description": "For example: de, pt-BR, zh-CN."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "page",
      "attributes": {
        "label": "Page URL or message key"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "original",
      "attributes": {
        "label": "Current wording"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "translation",
      "attributes": {
        "label": "Proposed translation",
        "description": "Use plain text and preserve placeholders such as {count}."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "attribution",
      "attributes": {
        "label": "Attribution and AI assistance",
        "description": "Identify adapted wording and its source/permission, and disclose material AI assistance. For original wording, say so."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
